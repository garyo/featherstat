<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .m { fill: #2a78d6; }
    .q { stroke: #2a78d6; }
    @media (prefers-color-scheme: dark) {
      .m { fill: #3987e5; }
      .q { stroke: #3987e5; }
    }
  </style>
  <defs>
    <mask id="slits">
      <rect width="64" height="64" fill="white"/>
      <!-- shaft slit through the vane -->
      <line x1="26" y1="42" x2="49" y2="9.5" stroke="black" stroke-width="3" stroke-linecap="round"/>
      <!-- barb notches: swept back toward the quill, stepped up the vane -->
      <line x1="12.5" y1="37.6" x2="27.7" y2="32.8" stroke="black" stroke-width="2.3" stroke-linecap="round"/>
      <line x1="16.9" y1="31.8" x2="32.9" y2="26.7" stroke="black" stroke-width="2.3" stroke-linecap="round"/>
      <line x1="22.0" y1="24.6" x2="38.0" y2="19.5" stroke="black" stroke-width="2.3" stroke-linecap="round"/>
    </mask>
  </defs>
  <!-- vane -->
  <path class="m" mask="url(#slits)" d="M50 8
    C 40 5.5, 25 13, 20.5 30
    C 18.9 36, 19.8 41.8, 23.2 44.6
    C 30.5 44.8, 41.8 36.6, 46.5 25
    C 48.5 19, 50 12, 50 8 Z"/>
  <!-- bare quill -->
  <line class="q" x1="15" y1="56.5" x2="24.2" y2="43.2" stroke-width="3.4" stroke-linecap="round" fill="none"/>
</svg>
