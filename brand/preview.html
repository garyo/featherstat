<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>featherstat mark preview</title>
<style>
  body { margin: 0; font: 13px system-ui; display: flex; }
  section { flex: 1; padding: 28px; }
  .light { background: #f9f9f7; color: #0b0b0b; }
  .dark { background: #0d0d0d; color: #fff; }
  .row { display: flex; align-items: flex-end; gap: 22px; margin: 18px 0 30px; }
  figure { margin: 0; text-align: center; }
  figcaption { margin-top: 6px; color: #898781; }
  .word { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 650; letter-spacing: 0.01em; }
</style>
</head>
<body>
  <section class="light">
    <h3>light</h3>
    <div class="row">
      <figure><img alt="featherstat mark" src="featherstat.svg" width="16" height="16"><figcaption>16</figcaption></figure>
      <figure><img alt="featherstat mark" src="featherstat.svg" width="24" height="24"><figcaption>24</figcaption></figure>
      <figure><img alt="featherstat mark" src="featherstat.svg" width="32" height="32"><figcaption>32</figcaption></figure>
      <figure><img alt="featherstat mark" src="featherstat.svg" width="48" height="48"><figcaption>48</figcaption></figure>
      <figure><img alt="featherstat mark" src="featherstat.svg" width="128" height="128"><figcaption>128</figcaption></figure>
    </div>
    <div class="word"><img alt="featherstat mark" src="featherstat.svg" width="28" height="28"> featherstat</div>
  </section>
  <section class="dark">
    <h3>dark</h3>
    <div class="row">
      <figure><img alt="featherstat mark" src="featherstat.svg" width="16" height="16"><figcaption>16</figcaption></figure>
      <figure><img alt="featherstat mark" src="featherstat.svg" width="24" height="24"><figcaption>24</figcaption></figure>
      <figure><img alt="featherstat mark" src="featherstat.svg" width="32" height="32"><figcaption>32</figcaption></figure>
      <figure><img alt="featherstat mark" src="featherstat.svg" width="48" height="48"><figcaption>48</figcaption></figure>
      <figure><img alt="featherstat mark" src="featherstat.svg" width="128" height="128"><figcaption>128</figcaption></figure>
    </div>
    <div class="word"><img alt="featherstat mark" src="featherstat.svg" width="28" height="28"> featherstat</div>
  </section>
</body>
</html>
