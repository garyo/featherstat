<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Analytics</title>
    <script>
      // Blocking, before the stylesheet paints: a remembered theme override must
      // beat the OS preference on the very first frame (src/lib/theme.ts owns the
      // key; docs/05 R12).
      var theme = null;
      try {
        theme = localStorage.getItem('theme');
      } catch {}
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
