name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Pinned to the version dev machines run: the workspace carries a
      # Bun-version-specific workaround (scripts that must use Node because
      # better-sqlite3 dies with a NAPI fatal error under Bun 1.3.4). Bump this
      # deliberately, together with that note and the Dockerfile's BUN_IMAGE.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      # Those Node-not-Bun scripts — the replay bench, the server CLIs — need a
      # Node that satisfies the workspace's engines field.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cache bun's install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      # check, build, test, bench — the same script the pre-push hook runs.
      - name: Gates
        run: bun run ci

  # docs/08 WP1 also wants a bun-runtime job to keep the "server stays
  # bun-compatible" promise honest. It cannot exist while better-sqlite3 aborts
  # the process under Bun; add it when that is fixed upstream.
